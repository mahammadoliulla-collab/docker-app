name: End-to-End CI-CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          flake8 --max-line-length=100
          pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            mahammadoliulla123/flask-demo:latest
            mahammadoliulla123/flask-demo:${{ github.sha }}

      - name: Smoke test deployed container health
        run: |
          docker run -d --name smoke-test -p 5000:5000 mahammadoliulla123/flask-demo:${{ github.sha }}
          sleep 3
          curl -f http://localhost:5000/health
          docker rm -f smoke-test